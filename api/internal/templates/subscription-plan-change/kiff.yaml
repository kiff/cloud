# subscription-plan-change gives the same support agent a count-based
# card for plan changes. Its balance and revocation are independent of
# refund and store-credit cards.

domain: subscription-plan-change
entity: Subscription

events:
  - SUBSCRIPTION_ACTIVATED
  - PLAN_CHANGED
  - SUBSCRIPTION_CANCELLED

states:
  - ACTIVE
  - CANCELLED

transitions:
  - on: SUBSCRIPTION_ACTIVATED
    from: ""
    to: ACTIVE
  - on: PLAN_CHANGED
    from: ACTIVE
    to: ACTIVE
  - on: SUBSCRIPTION_CANCELLED
    from: ACTIVE
    to: CANCELLED

actions:
  - name: CHANGE_PLAN
    allowed_states: [ACTIVE]
    required_parameters: [target_plan]
    parameters:
      - name: target_plan
        type: string
    required_permissions: [subscription.plan.change]
    risk: high
    approval: never
    executor: cloud.proxy
    requires_authority: true

  - name: ESCALATE_SUBSCRIPTION
    allowed_states: [ACTIVE]
    required_parameters: [reason]
    parameters:
      - name: reason
        type: string
    required_permissions: [subscription.escalate]
    risk: medium
    approval: never
    executor: cloud.proxy

permissions:
  roles:
    support:
      - subscription.plan.change
      - subscription.escalate
    admin:
      - subscription.plan.change
      - subscription.escalate
