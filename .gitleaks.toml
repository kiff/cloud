# The secret scan's rules (.github/workflows/secrets.yml): gitleaks' own,
# with the few places they misread allowed by path.
[extend]
useDefault = true

[allowlist]
description = "Known false positives"
paths = [
  # Generated by templ from the .templ files, which are scanned: the rule
  # reads a switch's case labels ("key-new", "key_revoked") as keys.
  '''_templ\.go$''',
  # Test fixtures: fixed signing secrets for the webhook tests, never real.
  '''^api/internal/clerkhook/clerkhook_test\.go$''',
  '''^api/internal/newdevice/newdevice_test\.go$''',
]
