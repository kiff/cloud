# The secret scan's rules (.github/workflows/secrets.yml): gitleaks' own,
# with the few places they misread allowed by path, and two test secrets
# by value.
[extend]
useDefault = true

[allowlist]
description = "Known false positives"
paths = [
  # Generated by templ from the .templ files, which are scanned: the rule
  # reads a switch's case labels ("key-new", "key_revoked") as keys.
  '''_templ\.go$''',
]
# The webhook tests' fixed signing secrets, never real, allowed by their
# value alone: anything else in those files is still scanned.
regexes = [
  '''^whsec_dGVzdC1zZWNyZXQtZm9yLWtpZmY=$''',
  '''^whsec_b3RoZXI=$''',
  # planque's step public key (SPKI, base64url), pinned to check its signed
  # browser blocks (api/internal/handlers/browser_block.go): public, the same
  # value the tafs Chrome extension's build pins. Allowed by its value alone.
  '''^MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAExS_lxBTwDdO8wf8ksu6kkIF8r3Z-Vp3tWZUKjlBjQezW0BhCCW_0tkGqRewu0qBL8KDggls0cjFF-NDcnAjH7g$''',
]
