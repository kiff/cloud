name: managed apps disclosed

# The apps a customer may connect as a managed connection (Composio, US) are
# disclosed on /subprocessors from web/internal/pages/managed_apps.json.
# planque keeps a copy and refuses a managed sign-in for any app not on it
# (kiff/planque internal/planque/managed_apps.json). Either file is a JSON
# array of names (only those apps) or {"all": true, "except": [...]} (every
# app but those). This check fails when planque allows an app this file
# doesn't: an app may be disclosed here before planque lets it through, never
# the other way round. It runs hourly
# too, since a change in planque doesn't run this repository's checks.

on:
  pull_request:
    paths:
      - 'web/internal/pages/managed_apps.json'
      - '.github/workflows/managed-apps.yml'
  push:
    branches: [main]
    paths:
      - 'web/internal/pages/managed_apps.json'
      - '.github/workflows/managed-apps.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: planque names only disclosed apps
        run: |
          url=https://raw.githubusercontent.com/kiff/planque/main/internal/planque/managed_apps.json
          code=$(curl -sS -o planque.json -w '%{http_code}' --retry 3 "$url")
          if [ "$code" = 404 ]; then
            echo "::notice::planque has no managed_apps.json on main yet; nothing to compare."
            exit 0
          fi
          if [ "$code" != 200 ]; then
            echo "::error::reading planque's list answered $code"
            exit 1
          fi
          python3 -I - planque.json web/internal/pages/managed_apps.json <<'EOF'
          import json, sys

          def read(name, path):
              v = json.load(open(path, encoding="utf-8"))
              if isinstance(v, list) and all(isinstance(a, str) for a in v):
                  return False, set(v), set()
              if (isinstance(v, dict) and v.get("all") is True and set(v) <= {"all", "named", "except"}
                      and all(isinstance(a, str) for k in ("named", "except") for a in v.get(k, []))
                      and v.get("except")):
                  return True, set(v.get("named", [])), set(v["except"])
              sys.exit(f"::error::{name}'s managed_apps.json is neither a JSON array of names nor {{\"all\": true, \"except\": [...]}}")

          p_all, p_named, p_except = read("planque", sys.argv[1])
          d_all, d_named, d_except = read("the disclosed list", sys.argv[2])
          if not d_all:
              if p_all:
                  sys.exit("::error::planque allows every managed app, but /subprocessors names only a list")
              undisclosed = sorted(p_named - d_named)
              if undisclosed:
                  sys.exit("::error::planque allows managed connections to apps /subprocessors doesn't name: " + ", ".join(undisclosed))
              waiting = sorted(d_named - p_named)
              if waiting:
                  print("::notice::disclosed, not yet allowed in planque: " + ", ".join(waiting))
          else:
              if p_all:
                  missing = sorted(d_except - p_except)
                  if missing:
                      sys.exit("::error::planque allows apps /subprocessors excludes: " + ", ".join(missing))
              else:
                  excluded = sorted(p_named & d_except)
                  if excluded:
                      sys.exit("::error::planque allows apps /subprocessors excludes: " + ", ".join(excluded))
                  print("::notice::/subprocessors allows every app but its exceptions; planque still allows only its list.")
          print("planque allows nothing /subprocessors doesn't disclose.")
          EOF
