name: Public text (pull request)

# This repo is public, and so is what's said on its pull requests. A pull request's title, its body and each review say
# what changed, why and how it was checked, never who decided it or where (scripts/public_text.py, --text). The text
# reaches the check only through env, never inside a run line, so nothing in it can run as a command. The check is the
# base branch's own copy of the script, so a pull request can't change the rule it's checked by.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: The pull request's title and body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | python3 scripts/public_text.py --text
      - name: The review's body
        if: github.event_name == 'pull_request_review'
        env:
          REVIEW: ${{ github.event.review.body }}
        run: printf '%s\n' "$REVIEW" | python3 scripts/public_text.py --text
